devices: (
{
    # STEP 1: RUN 'sudo logid' TO CONFIRM THIS NAME IS 100% CORRECT
    name: "MX Master 3S";

    # STEP 2: FORCE RATCHET MODE
    # Setting threshold to 255 makes it effectively impossible to auto-shift
    smartshift: { on: true; threshold: 255; }; 

    # STEP 3: REMOVE HIRESSCROLL BLOCK
    # We leave this out to let the OS handle scrolling normally, fixing the delay
    hirescroll: { hires: false; invert: false; target: false; };    

    dpi: 5000; 

    buttons: (
        {
            cid: 0xc3;
            action = {
                type: "Gestures";
                gestures: (
                    { direction: "Up";    mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_U"]; }; },
                    { direction: "Down";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_I"]; }; },
                    { direction: "Left";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_LEFT"]; }; },
                    { direction: "Right"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_RIGHT"]; }; },
                    { direction: "None";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA","KEY_LEFTSHIFT","KEY_ENTER"]; }; }
                );
            };
        },
        { cid: 0x53; action = { type: "Keypress"; keys: ["BTN_SIDE"]; }; },
        { cid: 0x56; action = { type: "Keypress"; keys: ["BTN_EXTRA"]; }; },
        { cid: 0xc4; action = { type: "ToggleSmartShift"; }; }
    );
}
);
