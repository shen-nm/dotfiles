[opener]
image_editor_viewer = [
    { run = 'imv "$@"', orphan = true, desc = "Open Image", for = "unix" }
]
extract = [
    { run = '7z x "$1" -o"${1%.*}"', desc = "Extract to new subfolder" },
    { run = '7z x "$1"', desc = "Extract here" }
]
play = [
    { run = 'mpv "$@"', orphan = true, desc = "Play Media" }
]
pdf = [
    { run = 'zathura "$@"', orphan = true, desc = "Open PDF" }
]
open = [
    { run = 'xdg-open "$1"', desc = "Open with System Default", orphan = true, for = "linux" }
]

[open]
rules = [
    { mime = "image/*", use = [ "image_editor_viewer", "open" ] }
]
prepend_rules = [
    { url = "*.pdf",  use = [ "pdf", "open" ] },
    { url = "*.docx", use = "open" },
    { url = "*.xlsx", use = "open" },
    { url = "*.pptx", use = "open" },

    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },

    { url = "*.zip", use = "extract" },
    { url = "*.rar", use = "extract" },
    { url = "*.7z",  use = "extract" },
    { url = "*.tar", use = "extract" },
    { url = "*.gz",  use = "extract" }
]
append_rules = [
    { url = "*", use = [ "edit", "open" ] }
]
